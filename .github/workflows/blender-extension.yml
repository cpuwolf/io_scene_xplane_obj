name: Build extension package

# On a v* tag: build the Blender extension zip and attach it to a DRAFT GitHub
# release, so the tag can be reviewed (and its zip downloaded) without anything
# being published yet.
#
# What goes into the zip is decided by [build] paths_exclude_pattern in
# blender_manifest.toml, so the package always matches what Blender expects.
# Submitting to https://extensions.blender.org/ stays manual.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write          # create the draft release

env:
  BLENDER_VERSION: "5.2.3"

jobs:
  package:
    # Pinned, not ubuntu-latest: the label is mid-migration from 24.04 to 26.04
    # (Oct-Nov 2026) and the apt package names below are 24.04's. Move it after
    # testing the build on ubuntu-26.04 explicitly.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # the tag annotation becomes the release notes

      - name: Install Blender
        run: |
          set -euo pipefail
          version="$BLENDER_VERSION"
          base="https://download.blender.org/release/Blender${version%.*}"
          archive="blender-${version}-linux-x64.tar.xz"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0
          mkdir -p "$RUNNER_TEMP/dl" "$HOME/blender"
          cd "$RUNNER_TEMP/dl"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/blender-${version}.sha256"
          grep " $archive\$" "blender-${version}.sha256" | sha256sum -c -
          tar -xf "$archive" -C "$HOME/blender" --strip-components=1
          echo "$HOME/blender" >> "$GITHUB_PATH"

      - name: The manifest version must match the tag
        run: |
          set -euo pipefail
          manifest=$(sed -n 's/^version = "\(.*\)"$/\1/p' blender_manifest.toml)
          tag="${GITHUB_REF#refs/tags/v}"
          echo "manifest $manifest / tag $tag"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::blender_manifest.toml says $manifest but the tag is $tag"
            exit 1
          fi

      - name: Build and validate
        run: |
          set -euo pipefail
          mkdir -p dist
          blender --factory-startup --command extension build \
            --source-dir . --output-dir dist
          blender --factory-startup --command extension validate dist/*.zip
          unzip -l dist/*.zip

      - uses: actions/upload-artifact@v7
        with:
          name: blender-extension
          path: dist/*.zip
          if-no-files-found: error

      - name: Create (or refresh) the draft release with the package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # the annotated tag message is the release body; fall back to the
          # commit list if the tag was made without one
          notes=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release exists already (re-run), replacing the asset"
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
          elif [ -n "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" dist/*.zip \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --notes "$notes"
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release view "$GITHUB_REF_NAME" --json isDraft,assets \
            --template '{{.isDraft}} {{range .assets}}{{.name}} ({{.size}}) {{end}}{{"\n"}}'
