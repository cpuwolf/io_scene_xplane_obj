name: Set up Blender
description: >
  Download a Blender release build for Linux, verify its published SHA-256,
  extract it and put it on PATH. Cached per version.

inputs:
  version:
    description: Exact Blender version, e.g. 4.2.23 or 5.2.3
    required: true

runs:
  using: composite
  steps:
    - name: Cache Blender
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/blender
        key: blender-${{ inputs.version }}-linux-x64

    - name: Install Blender ${{ inputs.version }}
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        version="${{ inputs.version }}"
        series="${version%.*}"          # 5.2.3 -> 5.2
        base="https://download.blender.org/release/Blender${series}"
        archive="blender-${version}-linux-x64.tar.xz"
        mkdir -p "$RUNNER_TEMP/dl"
        cd "$RUNNER_TEMP/dl"
        curl -fsSLO "$base/$archive"
        curl -fsSLO "$base/blender-${version}.sha256"
        # the .sha256 file lists every platform; check just the one we downloaded
        grep " $archive\$" "blender-${version}.sha256" | sha256sum -c -
        mkdir -p "$HOME/blender"
        tar -xf "$archive" -C "$HOME/blender" --strip-components=1

    - name: Runtime libraries for headless Blender
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0

    - name: Put Blender on PATH
      shell: bash
      run: |
        echo "$HOME/blender" >> "$GITHUB_PATH"
        "$HOME/blender/blender" --version | head -2
