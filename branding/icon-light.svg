<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>X-Plane OBJ8 Import</title>
  <defs>
    <clipPath id="rounded"><rect x="0" y="0" width="256" height="256" rx="46" ry="46"/></clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <rect x="0" y="0" width="256" height="256" fill="#EEF0F3"/>
    <!-- solid right half: mesh that has been converted -->
    <path d="M128 30 L212.87 79 L212.87 177 L128 226 Z" fill="#FF8A2B"/>
    <!-- hex wireframe: the source geometry -->
    <path d="M128 30 L212.87 79 L212.87 177 L128 226 L43.13 177 L43.13 79 Z"
          fill="none" stroke="#15181C" stroke-width="11" stroke-linejoin="round"/>
    <!-- internal facet lines, deliberately faint so they vanish at 48px -->
    <g stroke="#15181C" stroke-width="2.5" stroke-linecap="round" opacity="0.16">
      <path d="M128 30 L128 226"/>
      <path d="M128 128 L212.87 79 M128 128 L212.87 177 M128 128 L43.13 79 M128 128 L43.13 177"/>
    </g>
  </g>
</svg>
