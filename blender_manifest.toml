schema_version = "1.0.0"

# Blender extension manifest.  Kept at the repository root so
# `blender --command extension build` works from here; the zip it produces has
# these files at the archive root and Blender unpacks them into
# extensions/<repo>/io_scene_xplane_obj/.

id = "io_scene_xplane_obj"
version = "0.10.10"
name = "X-Plane OBJ8 Importer"
tagline = "Import X-Plane .obj or .acf into a scene XPlane2Blender exports"
maintainer = "Wei Shuai"
type = "add-on"

tags = ["Import-Export"]

website = "https://github.com/cpuwolf/io_scene_xplane_obj"
license = ["SPDX:GPL-3.0-or-later"]

blender_version_min = "5.0.0"

copyright = ["2026 Wei Shuai"]

# The add-on reads the .obj / .acf files the user opens (and writes none of them),
# which is what the `files` permission covers - the extension platform expects it
# for any add-on that touches the file system outside its own directory.
[permissions]
files = "Import X-Plane .obj and .acf files that you pick from disk"

# Build settings.  Only the shipped add-on belongs in the package: the verify /
# dev scripts, the dev symlink helper and the CI config stay in the repository.
# (`/scripts/` is excluded on purpose: those probes put this repository on
# sys.path and import modules into the global namespace, which the extension
# guidelines forbid inside a package - they are developer tools, not add-on code.)
[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/.github/",
  "/.gitignore",
  "/.DS_Store",
  "/dist/",
  "/verify/",
  "/scripts/",
  "/docs/",     # the README links to these on GitHub; the add-on does not read
                # them, and the extension platform renders only the README
  "/dev-link.sh",
  "/*.zip",
  "/*.gif",     # the README demo, 2 MB of it: GitHub can have it, the add-on
                # package cannot
]
