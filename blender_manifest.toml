schema_version = "1.0.0"

# Blender extension manifest.  Kept at the repository root so
# `blender --command extension build` works from here; the zip it produces has
# these files at the archive root and Blender unpacks them into
# extensions/<repo>/io_scene_xplane_obj/.

id = "io_scene_xplane_obj"
version = "0.12.1"
name = "X-Plane OBJ8 Import and Export"
tagline = "Import and export X-Plane .obj and .acf in one install"
maintainer = "Wei Shuai"
type = "add-on"

tags = ["Import-Export"]

website = "https://github.com/cpuwolf/io_scene_xplane_obj"
license = ["SPDX:GPL-3.0-or-later"]

blender_version_min = "5.0.0"

# The validator wants "<year> <name>" per entry, so each holder of the bundled
# exporter rides the upstream project's copyright span (created 2010-08-10);
# CREDITS.md carries who did what. Names exactly as upstream bl_info spells them.
copyright = [
  "2026 Wei Shuai",
  "2010-2026 Ted Greene",
  "2010-2026 Ben Supnik",
  "2010-2026 Amy Parent",
  "2010-2026 Maya F. Eroğlu",
]

# The export half ships as a Python wheel, and this key is what makes Blender
# unpack it.  It is a TOP-LEVEL key - `[build] wheels` is silently ignored: the
# file still ends up in the zip (paths cover the whole directory) but the runtime
# never installs it and `import io_xplane2blender` fails a second later.
#
# bl_extensions installs declared wheels into
# `extensions/.local/lib/pythonX.Y/site-packages` and puts that first in
# sys.path, so the exporter keeps its upstream top-level name and not one line of
# it is rewritten.  Regenerate with `python3 scripts/build_wheel.py` (gitignored:
# build artifact, 46 files); CI runs it before `extension build`.
wheels = ["./wheels/io_xplane2blender-4.5.0.post1-py3-none-any.whl"]

# The add-on reads the .obj / .acf files the user picks and writes the .obj files
# the exporter saves - the extension platform expects the `files` permission for
# any add-on that touches the file system outside its own directory.
[permissions]
files = "Read X-Plane .obj/.acf, write the .obj files you export"

# Build settings.  Only the shipped add-on belongs in the package: the verify /
# dev scripts, the dev symlink helper and the CI config stay in the repository.
# (`/scripts/` is excluded on purpose: those probes put this repository on
# sys.path and import modules into the global namespace, which the extension
# guidelines forbid inside a package - they are developer tools, not add-on code.
# `/wheels/` is NOT excluded: the wheel is what `wheels = ...` above promises.)
[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/.github/",
  "/.gitignore",
  "/.gitmodules",
  "/vendor/",     # the exporter's submodule: scripts/build_wheel.py packs it
                  # into wheels/*.whl, and the wheel is what ships
  "/.DS_Store",
  "/dist/",
  "/verify/",
  "/scripts/",
  "/docs/",     # the README links to these on GitHub; the add-on does not read
                # them, and the extension platform renders only the README
  "/dev-link.sh",
  "/*.zip",
  "/*.gif",     # the README demo, 2 MB of it: GitHub can have it, the add-on
                # package cannot
]
